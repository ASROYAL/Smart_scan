# Experiment configuration — acceptance-test regime.
# Overrides default.yaml for the 100-band, limited-observation benchmark.

environment:
  total_bandwidth: 1.0e+9
  center_frequency: 5.0e+8
  num_bands: 100
  noise_power_dbm: -100.0
  sample_rate: 2.0e+7

receiver:
  instantaneous_bandwidth: 2.0e+7   # 20 MHz of 1000 MHz => ~2 bands per look
  sample_rate: 2.0e+7
  dwell_time: 0.005
  tuning_delay: 0.001

detector:
  window: hann
  psd_method: welch
  noise_method: median
  threshold_margin_db: 6.0
  fft_size: 1024

scheduler:
  type: adaptive
  exploration_weight: 1.0
  recency_weight: 1.0
  uncertainty_weight: 1.0
  starvation_threshold: 5.0
  ewma_alpha: 0.15
  ucb_c: 2.0
  reward_hit: 1.0
  reward_miss: 0.0
  reward_revisit_penalty_scale: 0.005

simulation:
  duration: 15.0
  seed: 2024
  num_steps: 2000

database:
  backend: memory

logging:
  level: INFO
  log_dir: data/results
  export_csv: true
  export_json: true
