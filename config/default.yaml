environment:
  total_bandwidth: 1.0e+9       # 1000 MHz
  center_frequency: 5.0e+8      # 500 MHz (middle of band)
  num_bands: 50
  noise_power_dbm: -100.0
  sample_rate: 2.0e+7           # 20 Msps
  noise_drift_db: 0.0           # set >0 for slow nonstationary noise
  impulsive_noise_probability: 0.0
  impulsive_noise_gain_db: 12.0

receiver:
  instantaneous_bandwidth: 2.0e+7  # 20 MHz
  sample_rate: 2.0e+7
  dwell_time: 0.01              # 10 ms
  tuning_delay: 0.001           # 1 ms
  min_dwell_time: 0.002
  max_dwell_time: 0.02
  frequency_error_hz: 0.0
  gain_error_db: 0.0

detector:
  window: hann
  psd_method: welch
  noise_method: median
  threshold_margin_db: 6.0
  fft_size: 1024
  welch_overlap: 0.5

scheduler:
  type: round_robin
  exploration_weight: 1.0
  recency_weight: 1.0
  uncertainty_weight: 1.0
  starvation_threshold: 10.0
  ewma_alpha: 0.1
  ucb_c: 2.0
  reward_hit: 1.0
  reward_miss: 0.0
  reward_revisit_penalty_scale: 0.01
  max_revisit_gap: 0.75
  min_exploration_fraction: 0.15
  utility_activity_weight: 1.0
  utility_novelty_weight: 0.6
  utility_threat_weight: 0.8
  utility_timing_weight: 0.8
  utility_coverage_weight: 1.2
  utility_tuning_cost_weight: 0.15

simulation:
  # duration: null   # optional; if set, drives step count. Default: use the scenario's duration.
  seed: 42

database:
  backend: memory

logging:
  level: INFO
  log_dir: data/results
  export_csv: true
  export_json: true
